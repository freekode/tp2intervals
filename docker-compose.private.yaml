services:
  app:
    image: ${TP2INTERVALS_IMAGE:?Set a verified local tp2intervals image in .env}
    pull_policy: never
    restart: unless-stopped
    ports:
      - '127.0.0.1:${TP2INTERVALS_HOST_PORT:-8080}:8080'
    volumes:
      - ./data:/data
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlite:/data/tp2intervals.sqlite
      TP2INTERVALS_PREFLIGHT_TOKEN: "${TP2INTERVALS_PREFLIGHT_TOKEN:-}"
      TP2INTERVALS_PREVIEW_ONLY: "${TP2INTERVALS_PREVIEW_ONLY:-true}"
      TP2INTERVALS_ENABLE_SCHEDULED_FORWARD_SYNC: "${TP2INTERVALS_ENABLE_SCHEDULED_FORWARD_SYNC:-false}"
      TP2INTERVALS_SCHEDULE_INTERVAL_MINUTES: "${TP2INTERVALS_SCHEDULE_INTERVAL_MINUTES:-60}"
      TP2INTERVALS_SCHEDULE_TIMEZONE: "${TP2INTERVALS_SCHEDULE_TIMEZONE:-}"
