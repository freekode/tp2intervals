# Apply after the existing installation's Compose file. This preserves its
# service settings, including Traefik networks, hostname and labels.
services:
  app:
    image: ${TP2INTERVALS_FORK_IMAGE:?Set the verified fork image reference}
    pull_policy: never
    environment:
      SERVER_FORWARD_HEADERS_STRATEGY: "${SERVER_FORWARD_HEADERS_STRATEGY:-none}"
      SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES: "${SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES:-(?!)}"
      SPRING_DATASOURCE_URL: jdbc:sqlite:/data/tp2intervals.sqlite
      TP2INTERVALS_PREVIEW_ONLY: "${TP2INTERVALS_PREVIEW_ONLY:-true}"
      TP2INTERVALS_ENABLE_SCHEDULED_FORWARD_SYNC: "${TP2INTERVALS_ENABLE_SCHEDULED_FORWARD_SYNC:-false}"
      TP2INTERVALS_SCHEDULE_INTERVAL_MINUTES: "${TP2INTERVALS_SCHEDULE_INTERVAL_MINUTES:-60}"
      TP2INTERVALS_SCHEDULE_TIMEZONE: "${TP2INTERVALS_SCHEDULE_TIMEZONE:-}"
      TP2INTERVALS_PREFLIGHT_TOKEN: ${TP2INTERVALS_PREFLIGHT_TOKEN:?Set the runtime preview token}
    volumes: !override
      - "${TP2INTERVALS_DATA_DIR:?Set the existing or backed-up SQLite data directory}:/data"
