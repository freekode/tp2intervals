app:
  preview-only: ${TP2INTERVALS_PREVIEW_ONLY:false}
  training-peaks:
    api-url: https://tpapi.trainingpeaks.com
    preflight-token: ${TP2INTERVALS_PREFLIGHT_TOKEN:}
    schedule-interval-minutes: ${TP2INTERVALS_SCHEDULE_INTERVAL_MINUTES:60}
    schedule-timezone: ${TP2INTERVALS_SCHEDULE_TIMEZONE:}
    scheduled-forward-sync-enabled: ${TP2INTERVALS_ENABLE_SCHEDULED_FORWARD_SYNC:false}
  intervals:
    api-url: https://intervals.icu
  trainer-road:
    api-url: https://www.trainerroad.com
  attachments:
    enabled: false

spring:
  cloud:
    openfeign:
      client:
        config:
          default:
            loggerLevel: none
  jackson:
    default-property-inclusion: non_null
    serialization:
      fail-on-empty-beans: false
  datasource:
    url: jdbc:sqlite:tp2intervals.sqlite
    driver-class-name: org.sqlite.JDBC
  jpa:
    open-in-view: false
    database-platform: org.hibernate.community.dialect.SQLiteDialect
  cache:
    jcache:
      config: classpath:ehcache.xml

server:
  forward-headers-strategy: none
  tomcat:
    remoteip:
      # Opt-in native forwarding must name the trusted immediate proxy.
      internal-proxies: '(?!)'
  error:
    include-message: always

management:
  info:
    git:
      mode: full
  endpoints:
    web:
      exposure:
        include: 'health,info,loggers'
      cors:
        allowed-origins: '*'
  endpoint:
    loggers:
      enabled: true

logging:
  file:
    name: tp2intervals.log
