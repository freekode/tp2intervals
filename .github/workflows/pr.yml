name: Build PR

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jar:
    uses: ./.github/workflows/workflow-jar.yml
    with:
      jar-name: tp2intervals
      jar-artifact-name: tp2intervals-jar
      dry-run: true
      provider-free: true

  docker-image:
    needs: jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tp2intervals-jar
          path: artifact
      - name: Build local image
        run: docker build --build-arg JAR_PATH=artifact/tp2intervals.jar .

  electron:
    needs:
      - jar
    strategy:
      matrix:
        environment:
          - os: ubuntu-latest

    uses: ./.github/workflows/workflow-electron.yml
    with:
      jar-name: tp2intervals
      jar-artifact-name: tp2intervals-jar
      dry-run: true
      os: ${{ matrix.environment.os }}
